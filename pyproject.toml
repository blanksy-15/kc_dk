[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kcdk"
version = "0.1.0"
description = "Local DraftKings league analytics and publishing workflow"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "openai>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
